<section>
<h2>Day 1: From request to question</h2>
<ol>
<li><p>Khalil's card reads: "Measure how accurate Al-Hamra's bills were in 2026, using all billing data, and report the results to management." What should be added first?</p><ul><li><b>A.</b> A longer period, so the estimate is more precise</li><li><b>B.</b> The decision it informs and the number at which that decision changes</li><li><b>C.</b> A chart template for the management report</li><li><b>D.</b> A model of which bills will be inaccurate next year</li></ul></li>
<li><p>In month 13 Ghadeer moved meter reading in all six districts to a new contractor. Khalil asks: "Did the new contractor cut the number of estimated bills?" The decision is whether to renew the contract.</p><ul><li><b>A.</b> A description of estimated bills by month</li><li><b>B.</b> An experiment that randomises districts</li><li><b>C.</b> A causal analysis of existing data, stating its weaknesses</li><li><b>D.</b> A predictive model of estimated bills</li></ul></li>
<li><p>You suspect the repeat-contact rate is undercounted, but you do not know how the system links contacts. Which question do you ask Sultana?</p><ul><li><b>A.</b> "How does the system decide that two contacts come from the same customer?"</li><li><b>B.</b> "Is the repeat rate accurate?"</li><li><b>C.</b> "Surely some repeats are missed, right?"</li><li><b>D.</b> "Do you trust the repeat-contact figures?"</li></ul></li>
<li><p>Planning the burst analysis, a colleague asks for the billing extract with national IDs "in case we want to link bursts to customers later". The question is about bursts by month.</p><ul><li><b>A.</b> Take it: it is ready in two days</li><li><b>B.</b> Take it, but hash the national IDs</li><li><b>C.</b> Refuse it: Restricted data cannot be analysed</li><li><b>D.</b> Leave it out: the burst question needs no personal data; a later purpose gets its own request</li></ul></li>
<li><p>Sultana writes: "We need to know if the new call script is working." Her decision is whether to keep the script after the quarter. Which framing gives her a decision rule?</p><ul><li><b>A.</b> Report first-contact resolution every month for the next quarter, by district</li><li><b>B.</b> Keep it if 7-day repeat contacts fall 2 points against the old script</li><li><b>C.</b> Survey a sample of callers on whether they prefer the new script to the old</li><li><b>D.</b> Keep the script if agents mark more calls resolved than they did last year</li></ul></li>
<li><p>An analyst frames whether leak detection cut water loss in one district over 24 months. In month 14 a burst main closes part of the district's network for three weeks. Which part of the estimand records how the burst is handled?</p><ul><li><b>A.</b> The population: which districts and which months are included in it</li><li><b>B.</b> The contrast: what the district is compared with, and over which months</li><li><b>C.</b> The summary: which single number answers the question, in points</li><li><b>D.</b> Intercurrent events: what happens on the way that changes the meaning</li></ul></li>
<li><p>Four framing cards answer Khalil's request about estimated bills. Which one can a colleague plan from without asking anything further?</p><ul><li><b>A.</b> Population: Al-Hamra accounts, last 12 months. Metric: share of bills estimated. Rule: book second visits above 10%</li><li><b>B.</b> Population: all Ghadeer accounts. Metric: estimated bills. Rule: act if estimates seem too many</li><li><b>C.</b> Population: Al-Hamra accounts, last 12 months. Metric: share of bills estimated. Rule: decide after seeing the result</li><li><b>D.</b> Population: accounts that complained. Metric: complaints about estimated bills. Rule: book visits if complaints rise</li></ul></li>
<li><p>Nadia asks whether active leak detection "is working" in a district. The detection crews report that leaks found rose from 40 to 130 in a year. Which metric belongs on the framing card?</p><ul><li><b>A.</b> Leaks found per month in the district by the detection crews</li><li><b>B.</b> Leaks repaired per month in the district</li><li><b>C.</b> Non-revenue water as a share of the district's supply</li><li><b>D.</b> Hours worked by the detection crews</li></ul></li>
<li><p>Khalil asks: "Which accounts are likely to be estimated next month, so that we send readers there first?" Which kind of analysis does the request need?</p><ul><li><b>A.</b> A description of last year's estimated bills by district</li><li><b>B.</b> A predictive model scoring each account</li><li><b>C.</b> A causal analysis of why bills are estimated</li><li><b>D.</b> An experiment that sends readers to some accounts at random</li></ul></li>
<li><p>Nadia asks whether a text-message reminder would reduce late payments. The reminder can start next month for any accounts she chooses, and the decision is in four months. Which kind of analysis fits?</p><ul><li><b>A.</b> A description of late payments by district and by month</li><li><b>B.</b> A causal analysis of last year's payment data by district</li><li><b>C.</b> A predictive model of which accounts are likely to pay late</li><li><b>D.</b> A random experiment: reminders to half the accounts</li></ul></li>
<li><p>A manager asks whether a tariff change in 2019 reduced consumption. Meter reads before 2021 were not kept, and no decision depends on the answer. What should the analyst recommend?</p><ul><li><b>A.</b> A causal analysis comparing consumption in 2021 with that in 2024</li><li><b>B.</b> No analysis: the data cannot reach it, and no decision waits</li><li><b>C.</b> A description of consumption in each year since 2021</li><li><b>D.</b> A predictive model of consumption for next year by district</li></ul></li>
<li><p>You interview Sultana about the repeat-contact figure in her monthly report. Which question is most likely to show how the number is produced?</p><ul><li><b>A.</b> How does the system decide that a contact is a repeat?</li><li><b>B.</b> Is the repeat-contact figure in your monthly report accurate?</li><li><b>C.</b> Would you agree that repeat contacts are rising?</li><li><b>D.</b> Should we use repeat contacts as the main metric?</li></ul></li>
<li><p>Sultana said the first-contact target is 85%, that the supplier's bonus depends on it, and that the call script was shortened in month 13. Which line of the analyst's notes should be marked "assumed" rather than "heard"?</p><ul><li><b>A.</b> The first-contact target is 85%</li><li><b>B.</b> The supplier's bonus under the contract depends on the target</li><li><b>C.</b> Agents close calls early to reach the target</li><li><b>D.</b> The script was shortened in month 13</li></ul></li>
<li><p>Asked what she will do differently, Sultana answers: "Renew the call-centre contract or change its terms, at the board meeting on 1 March." Which part of the framing card does this answer fill?</p><ul><li><b>A.</b> The metric and its denominator</li><li><b>B.</b> The population and its period</li><li><b>C.</b> The comparison and its baseline</li><li><b>D.</b> The decision and its date</li></ul></li>
<li><p>A plan needs road-works records held by another government entity. Under the national data-sharing timeframe the request is assessed within 10 business days and shared within 5 of approval. The decision is in 12 business days. What follows?</p><ul><li><b>A.</b> The records arrive within 5 business days, so request them today</li><li><b>B.</b> The records cannot be shared between government entities at all</li><li><b>C.</b> They may take up to 15 business days, so phase one goes without them</li><li><b>D.</b> Start the analysis now and add the records to it when they arrive later</li></ul></li>
<li><p>To measure the share of estimated bills by district and month, an analyst writes a data request for the billing system. Which request fits the minimisation rule of the Personal Data Protection Law?</p><ul><li><b>A.</b> Account ID, district, month and the estimated flag</li><li><b>B.</b> The full billing table, including names and national IDs</li><li><b>C.</b> Names and addresses, so that readers can be sent</li><li><b>D.</b> A sample of 100 bills with every field</li></ul></li>
<li><p>The board decides in 10 business days and the analysis takes 4. Dataset A is ready in 2 business days, B in 8 and C in 20. Which scope should the plan take?</p><ul><li><b>A.</b> All three datasets, with the analysis starting on day 20</li><li><b>B.</b> A and B, with the analysis finishing on day 12</li><li><b>C.</b> None: tell the board the question cannot be answered</li><li><b>D.</b> A now, with B and C in a second phase</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Know the domain, plan the work</h2>
<ol>
<li><p>Four drafts for Mamdouh's logger request. Which one could a peer plan from without asking anything?</p><ul><li><b>A.</b> "Should Ghadeer buy loggers for Al-Rawdah next year? Buy if detection cut non-revenue water by 3 points or more in Al-Wurud against the other districts."</li><li><b>B.</b> "Analyse how many leaks the loggers found in Al-Wurud."</li><li><b>C.</b> "Should Ghadeer buy loggers if detection works?"</li><li><b>D.</b> "Build a model of leak risk by district."</li></ul></li>
<li><p>From month 13, Al-Wurud's crews search for leaks with acoustic loggers. Recorded leaks in Al-Wurud triple. A manager says "the network there is getting worse".</p><ul><li><b>A.</b> The network in Al-Wurud is deteriorating</li><li><b>B.</b> The loggers have already cut water loss threefold</li><li><b>C.</b> The repair records are unreliable and should be ignored</li><li><b>D.</b> The crews are searching; whether less water is lost must be read from non-revenue water</li></ul></li>
<li><p>Ghadeer sets readers a new target: 98% of meters read on the scheduled day. Which guardrail best exposes gaming of it?</p><ul><li><b>A.</b> Number of reader visits per day</li><li><b>B.</b> Size of the correction at the next actual read, by reader</li><li><b>C.</b> Share of meters read on the scheduled day, by district</li><li><b>D.</b> Readers' own notes on access problems</li></ul></li>
<li><p>An analyst computes non-revenue water for all six districts, sees which districts moved like Al-Wurud before month 13, and then writes into the plan that those two are the comparison.</p><ul><li><b>A.</b> Two comparison districts are too few</li><li><b>B.</b> Pre-period data should never be looked at</li><li><b>C.</b> The comparison was chosen after seeing the data, so it can bend toward a hoped-for result</li><li><b>D.</b> It should say "difference in differences" explicitly</li></ul></li>
<li><p>A plan compares Al-Nakheel's non-revenue water, bills rescaled to 30 days, in year 1 (27.7%) and year 2 (19.0%), after the smart meters, and concludes that the meters cut leakage.</p><ul><li><b>A.</b> Measurement change: the new meters bill water the old ones missed</li><li><b>B.</b> Small sample: twelve months each side are too few</li><li><b>C.</b> Regression to the mean: Al-Nakheel was picked for a bad month</li><li><b>D.</b> Seasonality: summer months differ</li></ul></li>
<li><p>Billed volume in one district fell 9% from June to July. June's bills covered 33 days and July's covered 30. What is the most likely explanation?</p><ul><li><b>A.</b> Use per day did not change: July's bills cover fewer days</li><li><b>B.</b> Customers in the district used less water in July than in June</li><li><b>C.</b> More water was lost to leaks in July</li><li><b>D.</b> More bills were estimated in July</li></ul></li>
<li><p>In a district where many bills are estimated, billed volume jumps in the month after a run of estimates, then falls back. What produces the jump?</p><ul><li><b>A.</b> A rise in consumption that month</li><li><b>B.</b> The actual read bills the water the estimates missed</li><li><b>C.</b> A bulk meter at the district inlet that drifted upward</li><li><b>D.</b> New accounts added to the district</li></ul></li>
<li><p>Smart meters replace old meters in one district in month 13. From that month non-revenue water in that district falls by 8 points, and in no other district. Which point in the process map explains it?</p><ul><li><b>A.</b> Customers reduced their use after seeing it on the new meters</li><li><b>B.</b> The bulk meter at the district inlet drifted</li><li><b>C.</b> New meters register water the old ones missed, so billing rose</li><li><b>D.</b> The billing cycle in that district became shorter from month 13</li></ul></li>
<li><p>After a target on repair time, the median days from report to closed job fell from 4 to 2. Which guardrail would show whether jobs are closed before leaks are fixed?</p><ul><li><b>A.</b> The number of jobs closed per month</li><li><b>B.</b> The share of jobs reopened after closure</li><li><b>C.</b> The average cost of a repair</li><li><b>D.</b> The median days from report to job opened</li></ul></li>
<li><p>Repair time once tracked customer satisfaction well while it ranged from 3 to 10 days. After it fell below one day, satisfaction stopped moving with it. Which kind of proxy failure is this?</p><ul><li><b>A.</b> Regressional: selecting on a noisy proxy selects the noise</li><li><b>B.</b> Extremal: the old relation does not hold in a new range</li><li><b>C.</b> Causal: acting on the proxy broke its link to the goal</li><li><b>D.</b> Adversarial: people gamed the measure</li></ul></li>
<li><p>Ghadeer wants a guardrail for its first-contact resolution target. Which measure is the best guardrail?</p><ul><li><b>A.</b> Average handle time per call, in minutes, by agent</li><li><b>B.</b> The number of calls answered per agent per day</li><li><b>C.</b> A survey of customer satisfaction, run once a year</li><li><b>D.</b> Contacts followed by another within 7 days</li></ul></li>
<li><p>In the water-loss tree, non-revenue water splits into real losses and apparent losses. Which of these is an apparent loss?</p><ul><li><b>A.</b> A burst main</li><li><b>B.</b> A leak on a service pipe</li><li><b>C.</b> Meter under-registration</li><li><b>D.</b> A tank overflowing at night</li></ul></li>
<li><p>After a target on first-contact resolution, calls marked resolved rose from 70% to 84%, contacts followed by another within 7 days rose from 21% to 25%, and handle time fell from 8.0 to 6.8 minutes. What do these numbers show?</p><ul><li><b>A.</b> Calls are marked resolved that were not resolved</li><li><b>B.</b> Service improved: more calls are resolved, faster</li><li><b>C.</b> Customers are calling more about unrelated matters</li><li><b>D.</b> Agents became more efficient with the new script</li></ul></li>
<li><p>A plan compares 8 months before with 8 months after. Monthly non-revenue water has a standard deviation of 2.0 points. With detectable change = 2.8 × sd × √(1/n1 + 1/n2), what is the smallest change the plan can detect?</p><ul><li><b>A.</b> 1.4 points</li><li><b>B.</b> 2.0 points</li><li><b>C.</b> 2.8 points</li><li><b>D.</b> 7.9 points</li></ul></li>
<li><p>Which line of an analysis plan states the result that would change the decision to buy leak loggers?</p><ul><li><b>A.</b> Buy if the effect is 3 points or more, with the interval above 1</li><li><b>B.</b> Buy if the fall in non-revenue water is statistically significant at 5%</li><li><b>C.</b> Look at the results together with the sponsor, then decide</li><li><b>D.</b> Report the effect with a clear chart and its 95% interval</li></ul></li>
<li><p>Why does a plan fix the comparison months and districts before anyone looks at the data?</p><ul><li><b>A.</b> So the choices cannot bend toward the hoped-for answer</li><li><b>B.</b> Data seen after the plan is written cannot legally be used</li><li><b>C.</b> Because the sponsor asks for a fixed timeline</li><li><b>D.</b> Because fewer choices make the code run faster</li></ul></li>
<li><p>Leak detection started in the district with the worst non-revenue water of the last quarter. The next quarter it fell by 3 points. Which threat must the plan answer first?</p><ul><li><b>A.</b> Seasonality between quarters</li><li><b>B.</b> Spillover to other districts</li><li><b>C.</b> Small sample of months</li><li><b>D.</b> Regression to the mean</li></ul></li>
<li><p>A new tariff started in all six districts in the same month as leak detection started in one of them. A before-after in the one district would suffer from which threat?</p><ul><li><b>A.</b> History: something else changed at the same time</li><li><b>B.</b> Selection: the district was chosen in a way linked to the outcome</li><li><b>C.</b> Spillover: one unit affects the others</li><li><b>D.</b> Construct: the metric means something different</li></ul></li>
<li><p>You review a peer's plan with three threats: seasonality (both periods are full years), small sample (16 months), and smart meters installed in one comparison district during the study, which moved its non-revenue water by 8 points. Which threat goes first in your review?</p><ul><li><b>A.</b> Seasonality</li><li><b>B.</b> The smart meters in the comparison district</li><li><b>C.</b> Small sample</li><li><b>D.</b> All three equally, in the order of the plan</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Review others' work</h2>
<ol>
<li><p>Three plans for the logger decision. Which one answers the bulk-meter drift and the month-13 changes?</p><ul><li><b>A.</b> Al-Wurud months 10 to 12 against 13 to 15</li><li><b>B.</b> Al-Wurud year 1 against year 2</li><li><b>C.</b> Leaks found in Al-Wurud, year 1 against year 2</li><li><b>D.</b> Al-Wurud against the other districts, months 1 to 9 against 15 to 24, without Al-Nakheel</li></ul></li>
<li><p>An analysis of estimated bills prints "estimated share: 16.4%" for Al-Hamra. The summary below says "about one bill in four is estimated in Al-Hamra".</p><ul><li><b>A.</b> Data handling</li><li><b>B.</b> Communication: the words misstate the output</li><li><b>C.</b> Method</li><li><b>D.</b> Inference</li></ul></li>
<li><p>A variant holds: a chart from 20%, unadjusted billing periods (moves the effect by 0.02 points), significance with no interval, and a before-after with no comparison (moves the effect from 2.3 to 4.1, past the 3-point rule).</p><ul><li><b>A.</b> The chart axis</li><li><b>B.</b> The missing interval</li><li><b>C.</b> The before-after with no comparison</li><li><b>D.</b> The unadjusted billing periods</li></ul></li>
<li><p>An assistant's notebook runs, and its summary's three numbers all appear in the output. The summary concludes that smart meters "cut leakage in Al-Nakheel by nine points".</p><ul><li><b>A.</b> Withhold it: the numbers are right but the method measures billing, not leakage</li><li><b>B.</b> Accept it: every number traces to the output</li><li><b>C.</b> Accept it once a chart is added</li><li><b>D.</b> Reject it because an assistant wrote it</li></ul></li>
<li><p>Four notes on the same flaw in Sareea's analysis, which treats estimated bills as actual reads.</p><ul><li><b>A.</b> "What about estimated reads?"</li><li><b>B.</b> "Use actual reads only."</li><li><b>C.</b> "You have overstated the change."</li><li><b>D.</b> "Cell s2 averages estimated bills as reads, so the change mixes billing timing with metering; recompute on actual reads and report the estimated share."</li></ul></li>
<li><p>A colleague sends a notebook with a clear summary at the top. Why does the review start by rerunning the notebook rather than reading the summary?</p><ul><li><b>A.</b> A rerun shows what the code does, a summary what the author thinks</li><li><b>B.</b> Reading the summary before the rerun would be unfair to the author</li><li><b>C.</b> Notebooks always hold errors that only a rerun of every cell shows</li><li><b>D.</b> The checklist asks for a rerun before any score is given for an area</li></ul></li>
<li><p>An analysis compares complaint counts across districts without dividing by the number of accounts. The districts have from 300 to 500 accounts. Which area of the checklist does this flaw belong to?</p><ul><li><b>A.</b> Question fit</li><li><b>B.</b> Inference</li><li><b>C.</b> Communication</li><li><b>D.</b> Data handling</li></ul></li>
<li><p>Two reviewers score the method of the same notebook: one gives 2, the other 0. What should they do?</p><ul><li><b>A.</b> Record the average, 1</li><li><b>B.</b> Keep the higher score, to be fair to the author</li><li><b>C.</b> Compare their evidence against the anchors</li><li><b>D.</b> Ask the author which score is right</li></ul></li>
<li><p>The rule is to buy loggers if the effect is at least 3 points. With no flaw, the analysis gives 2.1 points. With only flaw F3, it gives 3.6. What is the consequence of F3?</p><ul><li><b>A.</b> It moves the effect by 3.6 points</li><li><b>B.</b> It moves the effect by 1.5 points; no other consequence</li><li><b>C.</b> It reverses the decision, from do not buy to buy</li><li><b>D.</b> None: both numbers show that detection works</li></ul></li>
<li><p>A join on district names drops a third of one district's repair rows. The effect on non-revenue water is computed from the water balance, not from repairs. What does the join do to the effect?</p><ul><li><b>A.</b> Nothing: it changes only the count of leaks found</li><li><b>B.</b> It shrinks the effect in proportion to the rows dropped</li><li><b>C.</b> It reverses the decision</li><li><b>D.</b> It widens the interval only</li></ul></li>
<li><p>Four flaws in one variant: a chart axis from 20%; no interval reported; volumes not adjusted for the billing period, which moves the effect by 0.4 points but not across the rule; a before-after with no comparison, which reverses the decision. In which order do the review notes go?</p><ul><li><b>A.</b> Chart axis, interval, billing periods, before-after</li><li><b>B.</b> Before-after, billing periods, interval, chart axis</li><li><b>C.</b> Billing periods, before-after, chart axis, interval</li><li><b>D.</b> Interval, before-after, billing periods, chart axis</li></ul></li>
<li><p>An assistant's notebook runs. Its summary says use fell by 12%; the output above it shows a fall of 7%. Which check fails?</p><ul><li><b>A.</b> Reruns as delivered</li><li><b>B.</b> Every number traced to output</li><li><b>C.</b> Outside numbers sourced</li><li><b>D.</b> Method fits the question asked</li></ul></li>
<li><p>An analyst wants a public hosted assistant to analyse Ghadeer's real billing extract, classified Restricted. What should the analyst do?</p><ul><li><b>A.</b> Paste the extract, since the assistant does not keep data</li><li><b>B.</b> Paste it after removing names only</li><li><b>C.</b> Paste a sample of 200 rows instead</li><li><b>D.</b> Keep it inside; use synthetic data with the assistant</li></ul></li>
<li><p>An analyst uses an assistant's code and summary in a report for a government sponsor. What do SDAIA's Generative AI Guidelines for Government ask of the analyst?</p><ul><li><b>A.</b> Identify the generated content and verify it, code included</li><li><b>B.</b> Nothing more, if the entity has approved the assistant for use</li><li><b>C.</b> Rewrite every generated sentence by hand</li><li><b>D.</b> Avoid generated code in official work</li></ul></li>
<li><p>A review note reads: "Cell 4 compares months 10 to 12 with 13 to 15; use months 1 to 9 against 15 to 24." Which part does the author still need?</p><ul><li><b>A.</b> The problem</li><li><b>B.</b> The fix</li><li><b>C.</b> The consequence</li><li><b>D.</b> A friendlier tone</li></ul></li>
<li><p>A review shows that an assistant answered "did the smart meters change consumption?" with a before-after of billed volume. The meters are already installed everywhere they will be. Which kind of analysis should the review recommend?</p><ul><li><b>A.</b> A description of billed volume by district, before and after</li><li><b>B.</b> A causal analysis of use, against districts without smart meters</li><li><b>C.</b> An experiment that removes the new meters from a random set of homes</li><li><b>D.</b> A predictive model of next year's billed volume by district</li></ul></li>
<li><p>Your plan for the board is a causal analysis that needs night-flow data, which take 8 business days to obtain. The board now wants an answer in 3 business days. What do you recommend?</p><ul><li><b>A.</b> Keep the plan as it is and deliver the answer after the board has met</li><li><b>B.</b> Run the causal analysis on billed volume, which is ready today</li><li><b>C.</b> Drop the question: tell the board it cannot be answered in three days</li><li><b>D.</b> Describe the data on hand and their limits; the causal answer later</li></ul></li>
</ol>
</section>
