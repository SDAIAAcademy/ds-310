<script type="application/json" id="academy-data">{"v":1,"engine":"1.0.0","build":{"at":"2026-11-15T18:42:45Z","version":"2027.1.0","commit":"95ffc6b"},"course":{"id":"ds-310","code":"DS-310","title":"Problem Framing and Analytical Review","track":"data-science","lang":"en","dir":"ltr","url":"https://sdaiaacademy.github.io/ds-310/","repo":"SDAIAAcademy/ds-310","home":"index.html","outcomes":[{"id":"LO1","text":"Prepare a decision question with estimand, population, metric and decision rule from a vague request, given five requests from the utility's managers"},{"id":"LO2","text":"Analyse a metric set for proxy failure and gaming, and propose guardrail metrics, given the utility's metric tree for water loss and customer service"},{"id":"LO3","text":"Use domain documents and an expert interview to map how the data behind a metric are produced, given a briefing pack on metering, billing cycles and leak repair, and a role-played engineer"},{"id":"LO4","text":"Design an analysis plan stating data, method, threats to validity and the result that would change the decision, given a framed question, a data inventory and a two-week deadline"},{"id":"LO5","text":"Review an analysis for errors in question fit, data handling, method, inference and communication, given three seeded-flaw notebooks, one generated by an assistant"},{"id":"LO6","text":"Decide whether a request needs description, an experiment, a causal analysis, a predictive model or no analysis, given a role-played sponsor whose constraints change during the meeting"}],"unit":"day","units":[{"n":1,"id":"day1","label":"Day 1","title":"From request to question","sessions":[{"n":1,"label":"Session 1","title":"Requests are not questions"},{"n":2,"label":"Session 2","title":"Question types"},{"n":3,"label":"Session 3","title":"Interviewing a stakeholder"},{"n":4,"label":"Session 4","title":"Feasibility and scope"}]},{"n":2,"id":"day2","label":"Day 2","title":"Know the domain, plan the work","sessions":[{"n":1,"label":"Session 1","title":"How the data are made"},{"n":2,"label":"Session 2","title":"Metrics and proxies"},{"n":3,"label":"Session 3","title":"Analysis plans"},{"n":4,"label":"Session 4","title":"Threats to validity"}]},{"n":3,"id":"day3","label":"Day 3","title":"Review others' work","sessions":[{"n":1,"label":"Session 1","title":"A review checklist"},{"n":2,"label":"Session 2","title":"Finding the flaws that matter"},{"n":3,"label":"Session 3","title":"Reviewing assistant-generated analysis"},{"n":4,"label":"Session 4","title":"Review notes people act on"}]},{"n":4,"id":"capstone","label":"Capstone","title":"Capstone: the permits backlog, framed and defended","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-framing-q1","type":"single","prompt":"Khalil's card reads: \"Measure how accurate Al-Hamra's bills were in 2026, using all billing data, and report the results to management.\" What should be added first?","options":[{"key":"A","text":"A longer period, so the estimate is more precise"},{"key":"B","text":"The decision it informs and the number at which that decision changes"},{"key":"C","text":"A chart template for the management report"},{"key":"D","text":"A model of which bills will be inaccurate next year"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Without a decision and a rule, any result is \"interesting\" and none is acted on; the other gaps can wait until the decision is known.","misconceptions":["Treats more data as more answer: the card's problem is that no answer would change anything","","Confuses the delivery with the question: a format cannot fix a card with no decision","Moves too early to method: a model is chosen after the question, not instead of it"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-framing","title":"Which gap matters most in this card?"},"level":null,"pool":"checkpoint"},{"id":"check-question-type-q1","type":"single","prompt":"In month 13 Ghadeer moved meter reading in all six districts to a new contractor. Khalil asks: \"Did the new contractor cut the number of estimated bills?\" The decision is whether to renew the contract.","options":[{"key":"A","text":"A description of estimated bills by month"},{"key":"B","text":"An experiment that randomises districts"},{"key":"C","text":"A causal analysis of existing data, stating its weaknesses"},{"key":"D","text":"A predictive model of estimated bills"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It asks what a change did, the change is already made everywhere, and a decision depends on it: a causal analysis of existing data, with no untreated group named as its main weakness.","misconceptions":["Answers how many, not what the contractor did: a before-after count mixes the contractor with everything else that changed","Assumes the change can still be assigned at random: every district already moved, so no trial is possible","","Forecasts next month for each account; the question asks what a past change did"],"lo":["LO6"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-question-type","title":"What does this request need?"},"level":null,"pool":"checkpoint"},{"id":"check-interview-q1","type":"single","prompt":"You suspect the repeat-contact rate is undercounted, but you do not know how the system links contacts. Which question do you ask Sultana?","options":[{"key":"A","text":"\"How does the system decide that two contacts come from the same customer?\""},{"key":"B","text":"\"Is the repeat rate accurate?\""},{"key":"C","text":"\"Surely some repeats are missed, right?\""},{"key":"D","text":"\"Do you trust the repeat-contact figures?\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An open question about the process makes her describe the mechanism (linking by mobile number), and the mechanism tells you the direction of the error.","misconceptions":["","A closed question: it gets yes or no and never reveals the mobile-number matching","A leading question: it gets agreement, and plants your guess in her answer","Asks for her opinion of the number rather than how it is produced"],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-interview","title":"Which question finds out how a repeat is counted?"},"level":null,"pool":"checkpoint"},{"id":"check-feasibility-q1","type":"single","prompt":"Planning the burst analysis, a colleague asks for the billing extract with national IDs \"in case we want to link bursts to customers later\". The question is about bursts by month.","options":[{"key":"A","text":"Take it: it is ready in two days"},{"key":"B","text":"Take it, but hash the national IDs"},{"key":"C","text":"Refuse it: Restricted data cannot be analysed"},{"key":"D","text":"Leave it out: the burst question needs no personal data; a later purpose gets its own request"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Minimisation ties the data to the purpose. No part of the burst question needs customers, so no personal field enters the plan.","misconceptions":["Treats readiness as a reason: a dataset being quick to get does not make it necessary","Masks the symptom: hashed IDs are still personal data collected without a purpose","Confuses classification with need: an internal Restricted dataset can be used, but only for a purpose that needs it",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-feasibility","title":"How do you answer this data request?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Four drafts for Mamdouh's logger request. Which one could a peer plan from without asking anything?","options":[{"key":"A","text":"\"Should Ghadeer buy loggers for Al-Rawdah next year? Buy if detection cut non-revenue water by 3 points or more in Al-Wurud against the other districts.\""},{"key":"B","text":"\"Analyse how many leaks the loggers found in Al-Wurud.\""},{"key":"C","text":"\"Should Ghadeer buy loggers if detection works?\""},{"key":"D","text":"\"Build a model of leak risk by district.\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the first names a choice, the outcome that matters and the number at which the choice flips.","misconceptions":["","Names a topic and an activity: leaks found rise with searching, and no number would change a choice","A decision with no threshold: 'works' is undefined, so any result can be read either way","A method in place of a question: a model of leaks does not say what to buy"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which card is ready to plan from?"},"level":null,"pool":"checkpoint"},{"id":"check-data-made-q1","type":"single","prompt":"From month 13, Al-Wurud's crews search for leaks with acoustic loggers. Recorded leaks in Al-Wurud triple. A manager says \"the network there is getting worse\".","options":[{"key":"A","text":"The network in Al-Wurud is deteriorating"},{"key":"B","text":"The loggers have already cut water loss threefold"},{"key":"C","text":"The repair records are unreliable and should be ignored"},{"key":"D","text":"The crews are searching; whether less water is lost must be read from non-revenue water"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"How a number is made decides what it means: leaks found counts search effort plus leaks, so only the water balance can say whether losses fell.","misconceptions":["Reads the count as the state of the pipes: the count depends on how hard anyone looks","Assumes recorded leaks measure water saved: finding a leak is a step, the saving shows in the water balance","Blames the data without a mechanism: the records are correct, they count something else",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-data-made","title":"What does the rise in recorded leaks show?"},"level":null,"pool":"checkpoint"},{"id":"check-proxies-q1","type":"single","prompt":"Ghadeer sets readers a new target: 98% of meters read on the scheduled day. Which guardrail best exposes gaming of it?","options":[{"key":"A","text":"Number of reader visits per day"},{"key":"B","text":"Size of the correction at the next actual read, by reader"},{"key":"C","text":"Share of meters read on the scheduled day, by district"},{"key":"D","text":"Readers' own notes on access problems"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A guessed read must be corrected later; large corrections by one reader expose it, and the next read is made by the meter, not by the reader's report.","misconceptions":["Measures effort, not quality: more visits can rise while reads are faked","","Moves with the target, not against it: it rises when reads are faked","Comes from the people under the target, so it is gamed in the same move"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-proxies","title":"Which guardrail fits this target?"},"level":null,"pool":"checkpoint"},{"id":"check-plans-q1","type":"single","prompt":"An analyst computes non-revenue water for all six districts, sees which districts moved like Al-Wurud before month 13, and then writes into the plan that those two are the comparison.","options":[{"key":"A","text":"Two comparison districts are too few"},{"key":"B","text":"Pre-period data should never be looked at"},{"key":"C","text":"The comparison was chosen after seeing the data, so it can bend toward a hoped-for result"},{"key":"D","text":"It should say \"difference in differences\" explicitly"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A fork taken after looking is a forking path: write the rule for choosing comparison districts first, then apply it.","misconceptions":["Treats a smaller comparison as the flaw: two well-chosen districts can be a fine comparison if chosen in advance","Mistakes looking at the pre-period for the problem: the issue is choosing after seeing outcomes, not seeing data","","Assumes a method label makes a plan valid: the name of the method says nothing about when its choices were made"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-plans","title":"What is wrong with this plan?"},"level":null,"pool":"checkpoint"},{"id":"check-threats-q1","type":"single","prompt":"A plan compares Al-Nakheel's non-revenue water, bills rescaled to 30 days, in year 1 (27.7%) and year 2 (19.0%), after the smart meters, and concludes that the meters cut leakage.","options":[{"key":"A","text":"Measurement change: the new meters bill water the old ones missed"},{"key":"B","text":"Small sample: twelve months each side are too few"},{"key":"C","text":"Regression to the mean: Al-Nakheel was picked for a bad month"},{"key":"D","text":"Seasonality: summer months differ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The meters change how consumption is measured; the fall is apparent losses becoming bills, and leakage needs another measure.","misconceptions":["","Assumes the fall is noise: nine points is far beyond the monthly swing of rescaled bills","Applies the threat to the wrong choice: Al-Nakheel was not picked for an extreme month","Real but secondary: seasons repeat in both years, so they do not explain a step at month 13"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-threats","title":"What is the main threat to this plan?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Three plans for the logger decision. Which one answers the bulk-meter drift and the month-13 changes?","options":[{"key":"A","text":"Al-Wurud months 10 to 12 against 13 to 15"},{"key":"B","text":"Al-Wurud year 1 against year 2"},{"key":"C","text":"Leaks found in Al-Wurud, year 1 against year 2"},{"key":"D","text":"Al-Wurud against the other districts, months 1 to 9 against 15 to 24, without Al-Nakheel"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The comparison cancels shared history, the excluded months remove the drift, and leaving out Al-Nakheel removes its meter change.","misconceptions":["Uses the drift months as the baseline: the recalibration then looks like a saving","Answers seasonality but not history: everything that changed in month 13 still lands on detection","Measures an activity: leaks found rise with searching, whatever happens to water lost",""],"lo":["LO4"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which plan is protected against yesterday's main threats?"},"level":null,"pool":"checkpoint"},{"id":"check-checklist-q1","type":"single","prompt":"An analysis of estimated bills prints \"estimated share: 16.4%\" for Al-Hamra. The summary below says \"about one bill in four is estimated in Al-Hamra\".","options":[{"key":"A","text":"Data handling"},{"key":"B","text":"Communication: the words misstate the output"},{"key":"C","text":"Method"},{"key":"D","text":"Inference"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The number is right and the sentence is wrong: one in six, not one in four. Only a reviewer who reads the output against the words catches it.","misconceptions":["Blames the data step: the data were handled correctly and the right number was printed","","Confuses a wrong sentence with a wrong method: the computation is the right one for the question","Inference is about claims beyond the evidence; here the claim contradicts the evidence printed above it"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-checklist","title":"Which area does this flaw belong to?"},"level":null,"pool":"checkpoint"},{"id":"check-consequence-q1","type":"single","prompt":"A variant holds: a chart from 20%, unadjusted billing periods (moves the effect by 0.02 points), significance with no interval, and a before-after with no comparison (moves the effect from 2.3 to 4.1, past the 3-point rule).","options":[{"key":"A","text":"The chart axis"},{"key":"B","text":"The missing interval"},{"key":"C","text":"The before-after with no comparison"},{"key":"D","text":"The unadjusted billing periods"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It alone moves the answer across the decision rule, from do not buy to buy; the others mislead less or not at all.","misconceptions":["Ranks by visibility: the chart is the easiest to see but changes no number and no decision","Ranks by the area's prestige: an unstated interval misleads, but the decision flips elsewhere","","Ranks a real but negligible flaw by principle: 0.02 points cannot change anything here"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-consequence","title":"Which flaw goes first in the review?"},"level":null,"pool":"checkpoint"},{"id":"check-assistant-q1","type":"single","prompt":"An assistant's notebook runs, and its summary's three numbers all appear in the output. The summary concludes that smart meters \"cut leakage in Al-Nakheel by nine points\".","options":[{"key":"A","text":"Withhold it: the numbers are right but the method measures billing, not leakage"},{"key":"B","text":"Accept it: every number traces to the output"},{"key":"C","text":"Accept it once a chart is added"},{"key":"D","text":"Reject it because an assistant wrote it"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Passing three checks is not passing four: non-revenue water fell because the new meters bill more, so the claim about leakage is a measurement change.","misconceptions":["","Treats traced numbers as a verified conclusion: tracing checks the arithmetic, not what it measures","Assumes the problem is presentation: a clearer chart of the wrong measure still misleads","Blames the tool rather than the analysis: the same flaw would sink a human-written version"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-assistant","title":"What do you do with this summary?"},"level":null,"pool":"checkpoint"},{"id":"check-notes-q1","type":"single","prompt":"Four notes on the same flaw in Sareea's analysis, which treats estimated bills as actual reads.","options":[{"key":"A","text":"\"What about estimated reads?\""},{"key":"B","text":"\"Use actual reads only.\""},{"key":"C","text":"\"You have overstated the change.\""},{"key":"D","text":"\"Cell s2 averages estimated bills as reads, so the change mixes billing timing with metering; recompute on actual reads and report the estimated share.\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the last says where, what it does to the result, and what to do, in words about the analysis.","misconceptions":["Names the topic only: the author cannot tell where or why it matters","Has a fix but no consequence: the author cannot judge whether it is worth doing first","States a consequence with no location or fix, and about the author rather than the analysis",""],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-notes","title":"Which note will the author act on?"},"level":null,"pool":"checkpoint"},{"id":"q-framing-01","type":"single","prompt":"Sultana writes: \"We need to know if the new call script is working.\" Her decision is whether to keep the script after the quarter. Which framing gives her a decision rule?","options":[{"key":"A","text":"Report first-contact resolution every month for the next quarter, by district"},{"key":"B","text":"Keep it if 7-day repeat contacts fall 2 points against the old script"},{"key":"C","text":"Survey a sample of callers on whether they prefer the new script to the old"},{"key":"D","text":"Keep the script if agents mark more calls resolved than they did last year"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A rule names the number at which the choice changes and what it is compared with; repeat contacts measure resolution without relying on what agents mark.","misconceptions":["Takes monitoring for a rule: nothing says which number changes the choice","","Changes the question to satisfaction, with no threshold for the choice","Uses the measure the script can game as the rule, with no comparison"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"decision-rule","title":"A decision rule names the number at which the choice changes"},"level":"apply","pool":"practice"},{"id":"q-framing-02","type":"single","prompt":"An analyst frames whether leak detection cut water loss in one district over 24 months. In month 14 a burst main closes part of the district's network for three weeks. Which part of the estimand records how the burst is handled?","options":[{"key":"A","text":"The population: which districts and which months are included in it"},{"key":"B","text":"The contrast: what the district is compared with, and over which months"},{"key":"C","text":"The summary: which single number answers the question, in points"},{"key":"D","text":"Intercurrent events: what happens on the way that changes the meaning"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An event after the start that changes what the measure means is an intercurrent event; the estimand says how it is handled, for example by excluding those weeks.","misconceptions":["Thinks any event in the period changes the units studied","Confuses an event during the study with the choice of comparison","Thinks the burst only changes how the result is summarised",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"estimand-parts","title":"An estimand states exactly which number answers the question"},"level":"understand","pool":"practice"},{"id":"q-framing-03","type":"single","prompt":"Four framing cards answer Khalil's request about estimated bills. Which one can a colleague plan from without asking anything further?","options":[{"key":"A","text":"Population: Al-Hamra accounts, last 12 months. Metric: share of bills estimated. Rule: book second visits above 10%"},{"key":"B","text":"Population: all Ghadeer accounts. Metric: estimated bills. Rule: act if estimates seem too many"},{"key":"C","text":"Population: Al-Hamra accounts, last 12 months. Metric: share of bills estimated. Rule: decide after seeing the result"},{"key":"D","text":"Population: accounts that complained. Metric: complaints about estimated bills. Rule: book visits if complaints rise"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the first names the units and period, a measure with its denominator, and the number at which the choice changes.","misconceptions":["","Accepts a rule with no threshold and a metric with no denominator","Leaves the rule for after the result, where it bends to the number","Measures complaints, which depend on who chooses to call, not on estimates"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"peer-test","title":"A card is done when a peer can plan from it without asking you"},"level":"evaluate","pool":"practice"},{"id":"q-framing-04","type":"single","prompt":"Nadia asks whether active leak detection \"is working\" in a district. The detection crews report that leaks found rose from 40 to 130 in a year. Which metric belongs on the framing card?","options":[{"key":"A","text":"Leaks found per month in the district by the detection crews"},{"key":"B","text":"Leaks repaired per month in the district"},{"key":"C","text":"Non-revenue water as a share of the district's supply"},{"key":"D","text":"Hours worked by the detection crews"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision is about water lost; non-revenue water as a share of supply measures it, while leaks found rises with the search itself.","misconceptions":["Takes an activity count for the outcome: searching harder finds more leaks whatever happens to loss","Swaps one activity for another: repairs follow from finding","","Measures effort, which says nothing about water lost"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"leaks-found-trap","title":"Leaks found is an activity; water lost is the outcome"},"level":"analyze","pool":"practice"},{"id":"q-types-01","type":"single","prompt":"Khalil asks: \"Which accounts are likely to be estimated next month, so that we send readers there first?\" Which kind of analysis does the request need?","options":[{"key":"A","text":"A description of last year's estimated bills by district"},{"key":"B","text":"A predictive model scoring each account"},{"key":"C","text":"A causal analysis of why bills are estimated"},{"key":"D","text":"An experiment that sends readers to some accounts at random"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The request asks what will happen to each unit, which is a prediction; the reasons behind it are not needed to choose where readers go first.","misconceptions":["Stops at what happened, when the request is about each account next month","","Answers why, when the decision only needs who","Tests an action, when the request is to rank accounts"],"lo":["LO6"],"day":1,"session":2,"slide":{"deck":"day1","id":"four-labels","title":"Each kind of question needs a different kind of analysis"},"level":"apply","pool":"practice"},{"id":"q-types-02","type":"single","prompt":"Nadia asks whether a text-message reminder would reduce late payments. The reminder can start next month for any accounts she chooses, and the decision is in four months. Which kind of analysis fits?","options":[{"key":"A","text":"A description of late payments by district and by month"},{"key":"B","text":"A causal analysis of last year's payment data by district"},{"key":"C","text":"A predictive model of which accounts are likely to pay late"},{"key":"D","text":"A random experiment: reminders to half the accounts"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is causal and the action can still be assigned at random before the decision, so an experiment answers it most directly.","misconceptions":["Describes the problem, not what the reminder would change","Uses existing data when a cleaner test can still run in time","Ranks accounts but says nothing about the effect of the reminder",""],"lo":["LO6"],"day":1,"session":2,"slide":{"deck":"day1","id":"experiment-or-not","title":"An experiment only when the change can still be assigned at random"},"level":"evaluate","pool":"practice"},{"id":"q-types-03","type":"single","prompt":"A manager asks whether a tariff change in 2019 reduced consumption. Meter reads before 2021 were not kept, and no decision depends on the answer. What should the analyst recommend?","options":[{"key":"A","text":"A causal analysis comparing consumption in 2021 with that in 2024"},{"key":"B","text":"No analysis: the data cannot reach it, and no decision waits"},{"key":"C","text":"A description of consumption in each year since 2021"},{"key":"D","text":"A predictive model of consumption for next year by district"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The data start after the change and there is no decision to inform, so the honest recommendation is to reframe or not to analyse.","misconceptions":["Compares years that are both after the change, so it cannot show its effect","","Answers a nearby question and presents it as the one asked","Answers a question nobody asked"],"lo":["LO6"],"day":1,"session":2,"slide":{"deck":"day1","id":"unanswerable","title":"\"Unanswerable\" is an answer, if it comes with a better question"},"level":"analyze","pool":"practice"},{"id":"q-interview-01","type":"single","prompt":"You interview Sultana about the repeat-contact figure in her monthly report. Which question is most likely to show how the number is produced?","options":[{"key":"A","text":"How does the system decide that a contact is a repeat?"},{"key":"B","text":"Is the repeat-contact figure in your monthly report accurate?"},{"key":"C","text":"Would you agree that repeat contacts are rising?"},{"key":"D","text":"Should we use repeat contacts as the main metric?"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An open question about the counting rule makes the stakeholder describe the process, which is where the data can mislead.","misconceptions":["","Asks for a yes or no, which tells you nothing about how it is counted","Leads the answer toward your own belief","Hands the analyst's choice to the stakeholder"],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"open-questions","title":"Open questions find constraints; closed and leading ones find agreement"},"level":"apply","pool":"practice"},{"id":"q-interview-02","type":"single","prompt":"Sultana said the first-contact target is 85%, that the supplier's bonus depends on it, and that the call script was shortened in month 13. Which line of the analyst's notes should be marked \"assumed\" rather than \"heard\"?","options":[{"key":"A","text":"The first-contact target is 85%"},{"key":"B","text":"The supplier's bonus under the contract depends on the target"},{"key":"C","text":"Agents close calls early to reach the target"},{"key":"D","text":"The script was shortened in month 13"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Nobody said agents close calls early; it is the analyst's inference from the incentive, and it must be tested in the data before it is used.","misconceptions":["Treats every number in the notes as suspect, although she stated it","Forgets that she said it herself","","Confuses a stated date with an inference"],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"heard-assumed","title":"Write what you heard apart from what you assumed"},"level":"analyze","pool":"practice"},{"id":"q-interview-03","type":"single","prompt":"Asked what she will do differently, Sultana answers: \"Renew the call-centre contract or change its terms, at the board meeting on 1 March.\" Which part of the framing card does this answer fill?","options":[{"key":"A","text":"The metric and its denominator"},{"key":"B","text":"The population and its period"},{"key":"C","text":"The comparison and its baseline"},{"key":"D","text":"The decision and its date"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The answer names the choice between options and when it is made, which is the decision the card starts from.","misconceptions":["Confuses the action with the measure that informs it","Thinks the contract defines which units are studied","Reads the two options as the contrast of the estimand",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"six-topics","title":"Six topics cover most of what a stakeholder knows and you do not"},"level":"understand","pool":"practice"},{"id":"q-feasible-01","type":"single","prompt":"A plan needs road-works records held by another government entity. Under the national data-sharing timeframe the request is assessed within 10 business days and shared within 5 of approval. The decision is in 12 business days. What follows?","options":[{"key":"A","text":"The records arrive within 5 business days, so request them today"},{"key":"B","text":"The records cannot be shared between government entities at all"},{"key":"C","text":"They may take up to 15 business days, so phase one goes without them"},{"key":"D","text":"Start the analysis now and add the records to it when they arrive later"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Assessment and delivery together can take 15 business days, more than the 12 available, so the plan cannot depend on them.","misconceptions":["Counts the delivery time and forgets the assessment","Thinks the policy forbids sharing rather than setting a timeframe","","Ignores that they may arrive after the decision"],"lo":["LO4"],"day":1,"session":4,"slide":{"deck":"day1","id":"sharing-timeframe","title":"A sharing request can take three weeks, by policy"},"level":"apply","pool":"practice"},{"id":"q-feasible-02","type":"single","prompt":"To measure the share of estimated bills by district and month, an analyst writes a data request for the billing system. Which request fits the minimisation rule of the Personal Data Protection Law?","options":[{"key":"A","text":"Account ID, district, month and the estimated flag"},{"key":"B","text":"The full billing table, including names and national IDs"},{"key":"C","text":"Names and addresses, so that readers can be sent"},{"key":"D","text":"A sample of 100 bills with every field"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Minimisation limits the data to what the purpose needs: here an account key, district, month and the flag are enough.","misconceptions":["","Asks for everything in case it is useful later","Mixes the analysis with an operational task it does not need","Thinks a small sample excuses fields the purpose does not need"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"minimise-request","title":"Ask for what the purpose needs, not what happens to be ready"},"level":"apply","pool":"practice"},{"id":"q-feasible-03","type":"single","prompt":"The board decides in 10 business days and the analysis takes 4. Dataset A is ready in 2 business days, B in 8 and C in 20. Which scope should the plan take?","options":[{"key":"A","text":"All three datasets, with the analysis starting on day 20"},{"key":"B","text":"A and B, with the analysis finishing on day 12"},{"key":"C","text":"None: tell the board the question cannot be answered"},{"key":"D","text":"A now, with B and C in a second phase"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only A arrives early enough to leave the 4 days of analysis before day 10; B and C belong to a second phase.","misconceptions":["Puts completeness above the decision date","Forgets to add the analysis time to the arrival of B","Gives up when a smaller answer fits the date",""],"lo":["LO4"],"day":1,"session":4,"slide":{"deck":"day1","id":"cut-scope","title":"Cut the question until it fits, and say what the cut leaves out"},"level":"evaluate","pool":"practice"},{"id":"q-datamade-01","type":"single","prompt":"Billed volume in one district fell 9% from June to July. June's bills covered 33 days and July's covered 30. What is the most likely explanation?","options":[{"key":"A","text":"Use per day did not change: July's bills cover fewer days"},{"key":"B","text":"Customers in the district used less water in July than in June"},{"key":"C","text":"More water was lost to leaks in July"},{"key":"D","text":"More bills were estimated in July"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"30 days is 9% fewer than 33, which accounts for the whole fall; volumes must be rescaled to the same number of days before they are compared.","misconceptions":["","Reads billed volume as use without checking the period","Blames loss for a change in billing","Reaches for another known problem the data do not point to"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"billing-cycles","title":"A \"monthly\" bill covers 27 to 35 days, and that alone moves the percentage"},"level":"analyze","pool":"practice"},{"id":"q-datamade-02","type":"single","prompt":"In a district where many bills are estimated, billed volume jumps in the month after a run of estimates, then falls back. What produces the jump?","options":[{"key":"A","text":"A rise in consumption that month"},{"key":"B","text":"The actual read bills the water the estimates missed"},{"key":"C","text":"A bulk meter at the district inlet that drifted upward"},{"key":"D","text":"New accounts added to the district"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An estimate repeats past use; when a reader finally reaches the meter, the bill catches up with everything the estimates did not count.","misconceptions":["Reads a billing pattern as behaviour","","Looks at the supply side when the jump is in billing","Assumes a change in the population without evidence"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"estimated-bills","title":"Al-Hamra estimates one bill in six, and estimates miss the summer"},"level":"analyze","pool":"practice"},{"id":"q-datamade-03","type":"single","prompt":"Smart meters replace old meters in one district in month 13. From that month non-revenue water in that district falls by 8 points, and in no other district. Which point in the process map explains it?","options":[{"key":"A","text":"Customers reduced their use after seeing it on the new meters"},{"key":"B","text":"The bulk meter at the district inlet drifted"},{"key":"C","text":"New meters register water the old ones missed, so billing rose"},{"key":"D","text":"The billing cycle in that district became shorter from month 13"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Old meters under-register; new ones bill more of the same water, so non-revenue water falls with no change in what is lost.","misconceptions":["Reads a measurement change as a change in behaviour","Looks at supply when only the customer meters changed","","Picks a known cause the scenario does not mention"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"smart-meter-step","title":"Smart meters raised Al-Nakheel's bills by measuring, not by use"},"level":"apply","pool":"practice"},{"id":"q-proxy-01","type":"single","prompt":"After a target on repair time, the median days from report to closed job fell from 4 to 2. Which guardrail would show whether jobs are closed before leaks are fixed?","options":[{"key":"A","text":"The number of jobs closed per month"},{"key":"B","text":"The share of jobs reopened after closure"},{"key":"C","text":"The average cost of a repair"},{"key":"D","text":"The median days from report to job opened"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A job closed before the fix comes back as a reopened job, so the reopen rate worsens exactly when repair time is gamed.","misconceptions":["Counts activity, which rises with early closing","","Watches a measure early closing does not move","Measures a step before the one being gamed"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"guardrails","title":"A guardrail is a second metric that worsens when the first is gamed"},"level":"analyze","pool":"practice"},{"id":"q-proxy-02","type":"single","prompt":"Repair time once tracked customer satisfaction well while it ranged from 3 to 10 days. After it fell below one day, satisfaction stopped moving with it. Which kind of proxy failure is this?","options":[{"key":"A","text":"Regressional: selecting on a noisy proxy selects the noise"},{"key":"B","text":"Extremal: the old relation does not hold in a new range"},{"key":"C","text":"Causal: acting on the proxy broke its link to the goal"},{"key":"D","text":"Adversarial: people gamed the measure"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The relation held only in the range where it was observed; pushed outside it, the proxy no longer tracks the goal.","misconceptions":["Confuses noise in selection with a change of range","","Sees an action where only the range changed","Assumes gaming without any sign of it"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"goodhart-four","title":"A proxy fails under pressure in four ways"},"level":"understand","pool":"practice"},{"id":"q-proxy-03","type":"single","prompt":"Ghadeer wants a guardrail for its first-contact resolution target. Which measure is the best guardrail?","options":[{"key":"A","text":"Average handle time per call, in minutes, by agent"},{"key":"B","text":"The number of calls answered per agent per day"},{"key":"C","text":"A survey of customer satisfaction, run once a year"},{"key":"D","text":"Contacts followed by another within 7 days"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A call marked resolved that was not comes back as a repeat contact, so this measure worsens when the target is gamed.","misconceptions":["Moves in the same direction as the gaming: short calls help reach the target","Counts volume, which gaming does not reduce","Too slow and too rare to show gaming within the year",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"good-guardrail","title":"A good guardrail is hard to game in the same move"},"level":"evaluate","pool":"practice"},{"id":"q-proxy-04","type":"single","prompt":"In the water-loss tree, non-revenue water splits into real losses and apparent losses. Which of these is an apparent loss?","options":[{"key":"A","text":"A burst main"},{"key":"B","text":"A leak on a service pipe"},{"key":"C","text":"Meter under-registration"},{"key":"D","text":"A tank overflowing at night"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Apparent losses are water used but not billed, such as meter error or unauthorised use; the others are water that leaves the network.","misconceptions":["Water physically lost is a real loss","Water physically lost is a real loss","","Water physically lost is a real loss"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"metric-tree","title":"Ghadeer's metric tree runs from a goal to leaves people can move"},"level":"apply","pool":"practice"},{"id":"q-proxy-05","type":"single","prompt":"After a target on first-contact resolution, calls marked resolved rose from 70% to 84%, contacts followed by another within 7 days rose from 21% to 25%, and handle time fell from 8.0 to 6.8 minutes. What do these numbers show?","options":[{"key":"A","text":"Calls are marked resolved that were not resolved"},{"key":"B","text":"Service improved: more calls are resolved, faster"},{"key":"C","text":"Customers are calling more about unrelated matters"},{"key":"D","text":"Agents became more efficient with the new script"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"If more calls were truly resolved, fewer customers would call again; repeat contacts rose with shorter calls, the mark of a gamed target.","misconceptions":["","Takes the targeted measure at face value","Explains the repeats away without evidence","Ignores that repeats rose while resolution \"improved\""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"fcr-gamed","title":"More calls were marked resolved, and more customers called again"},"level":"analyze","pool":"practice"},{"id":"q-plan-01","type":"single","prompt":"A plan compares 8 months before with 8 months after. Monthly non-revenue water has a standard deviation of 2.0 points. With detectable change = 2.8 × sd × √(1/n1 + 1/n2), what is the smallest change the plan can detect?","options":[{"key":"A","text":"1.4 points"},{"key":"B","text":"2.0 points"},{"key":"C","text":"2.8 points"},{"key":"D","text":"7.9 points"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"2.8 × 2.0 × √(1/8 + 1/8) = 2.8 × 2.0 × 0.5 = 2.8 points.","misconceptions":["Divides by n without the square root","Stops at the standard deviation","","Forgets to divide by the number of months"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"detectable-change","title":"With raw bills the plan cannot see the 3 points it needs"},"level":"apply","pool":"practice"},{"id":"q-plan-02","type":"single","prompt":"Which line of an analysis plan states the result that would change the decision to buy leak loggers?","options":[{"key":"A","text":"Buy if the effect is 3 points or more, with the interval above 1"},{"key":"B","text":"Buy if the fall in non-revenue water is statistically significant at 5%"},{"key":"C","text":"Look at the results together with the sponsor, then decide"},{"key":"D","text":"Report the effect with a clear chart and its 95% interval"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the first fixes, before the data, the size of effect at which the choice changes and how sure it must be.","misconceptions":["","Takes significance for size: a tiny effect can be significant","Leaves the rule for after the result","Describes reporting, not the rule"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"would-change","title":"Write the result that would change the decision, in numbers"},"level":"evaluate","pool":"practice"},{"id":"q-plan-03","type":"single","prompt":"Why does a plan fix the comparison months and districts before anyone looks at the data?","options":[{"key":"A","text":"So the choices cannot bend toward the hoped-for answer"},{"key":"B","text":"Data seen after the plan is written cannot legally be used"},{"key":"C","text":"Because the sponsor asks for a fixed timeline"},{"key":"D","text":"Because fewer choices make the code run faster"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each choice made after seeing the data is a fork that can favour the expected answer; fixing them first keeps the result honest.","misconceptions":["","Invents a rule that does not exist","Mistakes scheduling for validity","Thinks the reason is technical"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"fixed-before","title":"Choices made after seeing the data bend the answer, even without fishing"},"level":"understand","pool":"practice"},{"id":"q-threats-01","type":"single","prompt":"Leak detection started in the district with the worst non-revenue water of the last quarter. The next quarter it fell by 3 points. Which threat must the plan answer first?","options":[{"key":"A","text":"Seasonality between quarters"},{"key":"B","text":"Spillover to other districts"},{"key":"C","text":"Small sample of months"},{"key":"D","text":"Regression to the mean"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A district picked for an extreme value tends to move back toward its usual level whatever is done; only a comparison shows what detection added.","misconceptions":["Possible, but the choice of district points to a stronger threat","Assumes the detection affected other districts","Blames the size of the data, not how the district was chosen",""],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"regression-to-mean","title":"The district picked for its worst month improves next month on its own"},"level":"analyze","pool":"practice"},{"id":"q-threats-02","type":"single","prompt":"A new tariff started in all six districts in the same month as leak detection started in one of them. A before-after in the one district would suffer from which threat?","options":[{"key":"A","text":"History: something else changed at the same time"},{"key":"B","text":"Selection: the district was chosen in a way linked to the outcome"},{"key":"C","text":"Spillover: one unit affects the others"},{"key":"D","text":"Construct: the metric means something different"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The tariff happened at the same time as detection, so a before-after cannot separate them; districts without detection share the tariff and remove it.","misconceptions":["","Names a real threat the scenario does not describe","Confuses an outside event with units affecting each other","Thinks the tariff changed what the metric measures"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"history-month-13","title":"Month 13 changed five things at once"},"level":"analyze","pool":"practice"},{"id":"q-threats-03","type":"single","prompt":"You review a peer's plan with three threats: seasonality (both periods are full years), small sample (16 months), and smart meters installed in one comparison district during the study, which moved its non-revenue water by 8 points. Which threat goes first in your review?","options":[{"key":"A","text":"Seasonality"},{"key":"B","text":"The smart meters in the comparison district"},{"key":"C","text":"Small sample"},{"key":"D","text":"All three equally, in the order of the plan"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An 8-point measurement change in a comparison district can reverse the result; the other two are answered or minor.","misconceptions":["Ranks by how familiar a threat is: full years already answer it","","Ranks a general weakness above one that moves the answer","Ranks by order of writing, not by consequence"],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"rank-threats","title":"List three threats, ordered by how much each could change the decision"},"level":"evaluate","pool":"practice"},{"id":"q-checklist-01","type":"single","prompt":"A colleague sends a notebook with a clear summary at the top. Why does the review start by rerunning the notebook rather than reading the summary?","options":[{"key":"A","text":"A rerun shows what the code does, a summary what the author thinks"},{"key":"B","text":"Reading the summary before the rerun would be unfair to the author"},{"key":"C","text":"Notebooks always hold errors that only a rerun of every cell shows"},{"key":"D","text":"The checklist asks for a rerun before any score is given for an area"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Prose can say something the output does not; rerunning first stops the summary from setting the reviewer's expectations.","misconceptions":["","Makes it a matter of courtesy, not evidence","Overstates: the point is checking, not assuming errors","Gives the rule without the reason for it"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"rerun-first","title":"A review starts by running the analysis, not by reading it"},"level":"understand","pool":"practice"},{"id":"q-checklist-02","type":"single","prompt":"An analysis compares complaint counts across districts without dividing by the number of accounts. The districts have from 300 to 500 accounts. Which area of the checklist does this flaw belong to?","options":[{"key":"A","text":"Question fit"},{"key":"B","text":"Inference"},{"key":"C","text":"Communication"},{"key":"D","text":"Data handling"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A missing denominator is a step in handling the data that changes the answer: larger districts have more complaints whatever the service.","misconceptions":["Thinks the question is wrong when the computation is","Places it at the claim, although the error is in the numbers","Places it in the words, although the numbers themselves are wrong",""],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"five-areas","title":"Five areas, from the question to the words, scored 0 to 2"},"level":"analyze","pool":"practice"},{"id":"q-checklist-03","type":"single","prompt":"Two reviewers score the method of the same notebook: one gives 2, the other 0. What should they do?","options":[{"key":"A","text":"Record the average, 1"},{"key":"B","text":"Keep the higher score, to be fair to the author"},{"key":"C","text":"Compare their evidence against the anchors"},{"key":"D","text":"Ask the author which score is right"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A two-point gap means one reviewer missed something; the anchors and the sentences of evidence show which.","misconceptions":["Hides the disagreement instead of finding its cause","Resolves by kindness, not evidence","","Hands the judgement to the person reviewed"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"reviewer-agreement","title":"A checklist is useful when two reviewers land within a point"},"level":"evaluate","pool":"practice"},{"id":"q-flaws-01","type":"single","prompt":"The rule is to buy loggers if the effect is at least 3 points. With no flaw, the analysis gives 2.1 points. With only flaw F3, it gives 3.6. What is the consequence of F3?","options":[{"key":"A","text":"It moves the effect by 3.6 points"},{"key":"B","text":"It moves the effect by 1.5 points; no other consequence"},{"key":"C","text":"It reverses the decision, from do not buy to buy"},{"key":"D","text":"None: both numbers show that detection works"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The flaw lifts the effect across the 3-point rule, which turns the answer from do not buy to buy.","misconceptions":["Reports the flawed number, not the change","Measures the size but misses that the rule is crossed","","Ignores the decision rule"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"consequence-defined","title":"The consequence of a flaw is what it does to the answer, measured"},"level":"apply","pool":"practice"},{"id":"q-flaws-02","type":"single","prompt":"A join on district names drops a third of one district's repair rows. The effect on non-revenue water is computed from the water balance, not from repairs. What does the join do to the effect?","options":[{"key":"A","text":"Nothing: it changes only the count of leaks found"},{"key":"B","text":"It shrinks the effect in proportion to the rows dropped"},{"key":"C","text":"It reverses the decision"},{"key":"D","text":"It widens the interval only"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The effect does not use the repair rows, so the join cannot move it; it still deserves a note because any count of leaks is wrong.","misconceptions":["","Assumes every flaw moves the headline number","Ranks by how alarming the flaw looks","Guesses a subtler effect without tracing the data"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"variant-zero","title":"Two of four flaws reverse the recommendation; two change nothing"},"level":"analyze","pool":"practice"},{"id":"q-flaws-03","type":"single","prompt":"Four flaws in one variant: a chart axis from 20%; no interval reported; volumes not adjusted for the billing period, which moves the effect by 0.4 points but not across the rule; a before-after with no comparison, which reverses the decision. In which order do the review notes go?","options":[{"key":"A","text":"Chart axis, interval, billing periods, before-after"},{"key":"B","text":"Before-after, billing periods, interval, chart axis"},{"key":"C","text":"Billing periods, before-after, chart axis, interval"},{"key":"D","text":"Interval, before-after, billing periods, chart axis"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A flaw that reverses the decision comes first, then the one that moves the number, then those that mislead without moving it.","misconceptions":["Ranks in the order flaws are easiest to see","","Ranks by the size of a number, not by the decision","Ranks a principle above a flaw that reverses the decision"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"rank-rule","title":"Rank by consequence, not by the order you found the flaws"},"level":"evaluate","pool":"practice"},{"id":"q-assistant-01","type":"single","prompt":"An assistant's notebook runs. Its summary says use fell by 12%; the output above it shows a fall of 7%. Which check fails?","options":[{"key":"A","text":"Reruns as delivered"},{"key":"B","text":"Every number traced to output"},{"key":"C","text":"Outside numbers sourced"},{"key":"D","text":"Method fits the question asked"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The 12% appears nowhere in the output: a number in the summary must be found in what the code printed.","misconceptions":["The notebook ran, so this check passes","","Both numbers come from the data, not from outside","The mismatch is between the words and the output, not the method"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"four-checks","title":"All four checks fail, each with its evidence"},"level":"apply","pool":"practice"},{"id":"q-assistant-02","type":"single","prompt":"An analyst wants a public hosted assistant to analyse Ghadeer's real billing extract, classified Restricted. What should the analyst do?","options":[{"key":"A","text":"Paste the extract, since the assistant does not keep data"},{"key":"B","text":"Paste it after removing names only"},{"key":"C","text":"Paste a sample of 200 rows instead"},{"key":"D","text":"Keep it inside; use synthetic data with the assistant"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Restricted data does not go to a public assistant; synthetic data with the same columns lets the analyst use the tool without the risk.","misconceptions":["Trusts a claim about the service in place of the classification rule","Thinks removing one field changes the classification of the whole extract","Thinks a sample is not the same data",""],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"hosted-models","title":"A hosted model may analyse synthetic data; Ghadeer's real extracts stay inside"},"level":"evaluate","pool":"practice"},{"id":"q-assistant-03","type":"single","prompt":"An analyst uses an assistant's code and summary in a report for a government sponsor. What do SDAIA's Generative AI Guidelines for Government ask of the analyst?","options":[{"key":"A","text":"Identify the generated content and verify it, code included"},{"key":"B","text":"Nothing more, if the entity has approved the assistant for use"},{"key":"C","text":"Rewrite every generated sentence by hand"},{"key":"D","text":"Avoid generated code in official work"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The guidelines ask users to identify AI-generated content and check it for accuracy, and to verify generated code before using it.","misconceptions":["","Thinks approval of a tool removes the duty to check its output","Confuses verification with rewriting","Turns a duty to verify into a ban"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"duty-to-verify","title":"Verifying assistant output before use is a duty, not a courtesy"},"level":"understand","pool":"practice"},{"id":"q-notes-01","type":"single","prompt":"A review note reads: \"Cell 4 compares months 10 to 12 with 13 to 15; use months 1 to 9 against 15 to 24.\" Which part does the author still need?","options":[{"key":"A","text":"The problem"},{"key":"B","text":"The fix"},{"key":"C","text":"The consequence"},{"key":"D","text":"A friendlier tone"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The author cannot tell how much the flaw matters: the note must say what it does to the number or the decision.","misconceptions":["The note already says where and what","The note already says what to do","","The tone is already about the analysis, not the author"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"note-parts","title":"Three parts, each a full sentence"},"level":"apply","pool":"practice"},{"id":"q-notes-02","type":"single","prompt":"A review shows that an assistant answered \"did the smart meters change consumption?\" with a before-after of billed volume. The meters are already installed everywhere they will be. Which kind of analysis should the review recommend?","options":[{"key":"A","text":"A description of billed volume by district, before and after"},{"key":"B","text":"A causal analysis of use, against districts without smart meters"},{"key":"C","text":"An experiment that removes the new meters from a random set of homes"},{"key":"D","text":"A predictive model of next year's billed volume by district"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is causal and the change cannot be assigned again, so it needs a comparison with districts without the meters, on a measure the meters do not change.","misconceptions":["Repeats the measure that the meters themselves changed","","Proposes an action that is no longer possible","Answers a question nobody asked"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"recommend-kind","title":"A review can conclude that the request needed another kind of analysis"},"level":"evaluate","pool":"practice"},{"id":"q-notes-03","type":"single","prompt":"Your plan for the board is a causal analysis that needs night-flow data, which take 8 business days to obtain. The board now wants an answer in 3 business days. What do you recommend?","options":[{"key":"A","text":"Keep the plan as it is and deliver the answer after the board has met"},{"key":"B","text":"Run the causal analysis on billed volume, which is ready today"},{"key":"C","text":"Drop the question: tell the board it cannot be answered in three days"},{"key":"D","text":"Describe the data on hand and their limits; the causal answer later"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A changed deadline changes the kind of analysis: a description with its limits stated now, and the causal answer when the data arrive.","misconceptions":["Puts the method above the decision date","Swaps in a measure the plan already rejected","Gives up when a smaller answer fits",""],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"recommend-kind","title":"A review can conclude that the request needed another kind of analysis"},"level":"evaluate","pool":"practice"}]}</script>
